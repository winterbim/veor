name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Linux sandbox tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap build-essential
      - name: Install
        run: npm ci || npm install
      - name: Parse + test gate
        run: npm run check
      - name: Boundary demo (live gateway + receipt artefact)
        run: npm run demo
      - name: Offline receipt verify (third-party proof)
        run: npm run verify
      - name: Self-dogfood (VEOR on VEOR)
        run: npm run self
      - name: Offline verify self ALLOW receipt
        run: npm run verify:self
