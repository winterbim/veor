name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install bubblewrap (honest OS isolation backend when available)
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Install (zero runtime deps; lockfile only)
        run: npm ci || npm install
      - name: Parse + test gate
        run: npm run check
      - name: Boundary demo (live gateway + receipt artefact)
        run: npm run demo
      - name: Offline receipt verify (third-party proof)
        run: npm run verify
      - name: Self-dogfood (VEOR on VEOR)
        run: npm run self
      - name: Offline verify self ALLOW receipt
        run: npm run verify:self
